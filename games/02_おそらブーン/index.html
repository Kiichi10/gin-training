<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>おそらブーン！🛩️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    touch-action: none;
    font-family: 'Hiragino Maru Gothic ProN', sans-serif;
    background: #000;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; }

  .screen-overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; gap: 12px;
    transition: opacity 0.3s;
  }
  .screen-overlay.hidden { opacity: 0; pointer-events: none; }

  #title-screen { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); }
  #gameover-screen { background: rgba(0,0,0,0.75); }
  #select-screen { background: linear-gradient(135deg, #1a1a2e, #16213e); }

  .title { font-size: clamp(2.5rem, 10vw, 5rem); font-weight: 900; }
  .title .t1 { color: #FFD700; text-shadow: 0 0 20px rgba(255,215,0,0.5); }
  .title .t2 { color: #FF6B6B; text-shadow: 0 0 20px rgba(255,107,107,0.5); }

  .subtitle {
    color: rgba(255,255,255,0.8); font-size: clamp(0.9rem, 3vw, 1.3rem);
    text-align: center; line-height: 1.6;
  }

  .btn {
    font-size: clamp(1.3rem, 4vw, 2rem);
    padding: 14px 45px; border: none; border-radius: 50px;
    font-weight: bold; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #333; box-shadow: 0 5px 0 #cc8400, 0 5px 20px rgba(255,165,0,0.3);
  }
  .btn-secondary {
    background: linear-gradient(135deg, #6C63FF, #4834DF);
    color: white; box-shadow: 0 5px 0 #3626a3, 0 5px 20px rgba(108,99,255,0.3);
  }

  /* 乗り物選択 */
  .vehicle-grid {
    display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
    max-width: 90vw;
  }
  .vehicle-card {
    width: clamp(90px, 22vw, 130px); height: clamp(100px, 25vw, 140px);
    background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.2);
    border-radius: 15px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
    cursor: pointer; transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .vehicle-card:active, .vehicle-card.selected {
    border-color: #FFD700; background: rgba(255,215,0,0.15);
    transform: scale(1.05);
  }
  .vehicle-card .emoji { font-size: clamp(2.5rem, 8vw, 4rem); }
  .vehicle-card .name { color: white; font-size: clamp(0.7rem, 2vw, 0.9rem); font-weight: bold; }

  /* ゲームオーバー */
  .score-display {
    font-size: clamp(3rem, 12vw, 6rem); color: #FFD700;
    font-weight: 900; text-shadow: 0 0 30px rgba(255,215,0,0.5);
  }
  .score-label { color: rgba(255,255,255,0.7); font-size: clamp(1rem, 3vw, 1.5rem); }
  .best-score { color: #FF6B6B; font-size: clamp(1rem, 3vw, 1.5rem); font-weight: bold; }

  /* HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 8px 15px; display: flex;
    justify-content: space-between; align-items: center;
    z-index: 10; pointer-events: none;
  }
  .hud-item {
    color: white; font-weight: bold;
    font-size: clamp(1rem, 3vw, 1.5rem);
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  #voice-bar {
    position: fixed; left: 8px; top: 50%;
    transform: translateY(-50%);
    width: 12px; height: 40vh;
    background: rgba(255,255,255,0.15); border-radius: 6px;
    z-index: 10; overflow: hidden;
  }
  #voice-bar-fill {
    position: absolute; bottom: 0; width: 100%;
    background: linear-gradient(0deg, #4CAF50, #FFD700, #FF5722);
    border-radius: 6px; transition: height 0.05s;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- ボイスバー -->
<div id="voice-bar"><div id="voice-bar-fill"></div></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-item" id="hud-score">0</div>
  <div class="hud-item" id="hud-combo"></div>
  <div class="hud-item" id="hud-best">🏆 0</div>
</div>

<!-- タイトル画面 -->
<div class="screen-overlay" id="title-screen">
  <div class="title"><span class="t1">おそら</span><span class="t2">ブーン！</span></div>
  <div style="font-size:clamp(3rem,12vw,6rem)">🛩️</div>
  <div class="subtitle">
    こえを だすと うえに あがるよ！<br>
    おおきい こえで たかく とべ！
  </div>
  <button class="btn btn-primary" id="btn-start">あそぶ！</button>
</div>

<!-- 乗り物選択画面 -->
<div class="screen-overlay hidden" id="select-screen">
  <div style="color:#FFD700; font-size:clamp(1.5rem,5vw,2.5rem); font-weight:bold;">のりものを えらぼう！</div>
  <div class="vehicle-grid" id="vehicle-grid"></div>
  <button class="btn btn-primary" id="btn-go">しゅっぱつ！</button>
</div>

<!-- ゲームオーバー画面 -->
<div class="screen-overlay hidden" id="gameover-screen">
  <div style="color:white; font-size:clamp(1.5rem,5vw,2.5rem); font-weight:bold;" id="go-title">ゲームオーバー</div>
  <div class="score-label">スコア</div>
  <div class="score-display" id="go-score">0</div>
  <div class="best-score" id="go-best"></div>
  <div id="go-animals" style="font-size:clamp(1rem,3vw,1.5rem); color:white;"></div>
  <button class="btn btn-primary" id="btn-retry">もういっかい！</button>
  <button class="btn btn-secondary" id="btn-title">タイトルへ</button>
</div>

<script>
// ========== CONFIG ==========
const VEHICLES = [
  { id: 'plane', emoji: '✈️', name: 'ひこうき', color: '#E0E0E0', speed: 1.0, size: 1.0 },
  { id: 'rocket', emoji: '🚀', name: 'ロケット', color: '#FF6B6B', speed: 1.3, size: 0.9 },
  { id: 'heli', emoji: '🚁', name: 'ヘリコプター', color: '#4CAF50', speed: 0.8, size: 1.1 },
  { id: 'ufo', emoji: '🛸', name: 'ユーフォー', color: '#9C27B0', speed: 1.1, size: 1.0 },
];

const ZONES = [
  { name: 'そら', bgTop: '#87CEEB', bgBot: '#E0F7FA', groundColor: '#4CAF50', obstacles: 'clouds' },
  { name: 'まち', bgTop: '#FF9800', bgBot: '#FFE0B2', groundColor: '#795548', obstacles: 'buildings' },
  { name: 'うちゅう', bgTop: '#1a1a2e', bgBot: '#16213e', groundColor: '#333', obstacles: 'asteroids' },
  { name: 'にじ', bgTop: '#E1BEE7', bgBot: '#F3E5F5', groundColor: '#66BB6A', obstacles: 'rainbow' },
];

// ========== AUDIO ENGINE ==========
const SFX = {
  ctx: null,
  init() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  resume() { if (this.ctx?.state === 'suspended') this.ctx.resume(); },
  play(freq, type, dur, vol = 0.1) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + dur);
  },
  coin() {
    this.play(988, 'sine', 0.1, 0.12);
    setTimeout(() => this.play(1319, 'sine', 0.15, 0.12), 60);
  },
  hit() { this.play(150, 'sawtooth', 0.3, 0.15); },
  powerup() {
    [523, 659, 784, 1047].forEach((f, i) =>
      setTimeout(() => this.play(f, 'sine', 0.2, 0.1), i * 70));
  },
  combo(n) {
    const f = 440 + n * 50;
    this.play(f, 'triangle', 0.12, 0.08);
  },
  milestone() {
    [784, 988, 1175, 1319].forEach((f, i) =>
      setTimeout(() => this.play(f, 'sine', 0.25, 0.12), i * 100));
  },
  animalRescue() {
    [660, 880, 1100].forEach((f, i) =>
      setTimeout(() => this.play(f, 'triangle', 0.2, 0.1), i * 120));
  }
};

// ========== GAME STATE ==========
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

let state = 'title'; // title, select, playing, gameover
let selectedVehicle = VEHICLES[0];
let score = 0;
let bestScore = parseInt(localStorage.getItem('osora_best') || '0');
let combo = 0;
let maxCombo = 0;
let coinStreak = 0;
let frameCount = 0;
let difficulty = 0;
let zoneIndex = 0;
let zoneProgress = 0;
let shakeAmount = 0;
let flashAlpha = 0;

// Player
let player = { x: 0, y: 0, vy: 0, size: 40, alive: true, invincible: 0, shield: false };

// World
let obstacles = [];
let coins = [];
let powerups = [];
let particles = [];
let bgStars = [];
let animals = []; // 救出動物
let rescuedAnimals = [];
let trails = [];

// Mic
let micReady = false;
let analyser, micData;
let voiceLevel = 0;
let smoothVoice = 0;

// Touch fallback
let touching = false;

// ========== CANVAS RESIZE ==========
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  player.x = W * 0.2;
}
window.addEventListener('resize', resize);
resize();

// ========== MIC SETUP ==========
async function setupMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(stream);
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.5;
    src.connect(analyser);
    micData = new Uint8Array(analyser.frequencyBinCount);
    micReady = true;
    // Resume on touch for iOS
    document.addEventListener('touchstart', () => {
      if (actx.state === 'suspended') actx.resume();
    }, { once: true });
  } catch (e) {
    console.warn('Mic unavailable:', e);
  }
}

function readMic() {
  if (!micReady || !analyser) return 0;
  analyser.getByteTimeDomainData(micData);
  let sum = 0;
  for (let i = 0; i < micData.length; i++) {
    const v = (micData[i] - 128) / 128;
    sum += v * v;
  }
  return Math.sqrt(sum / micData.length);
}

// ========== VEHICLE SELECTION ==========
function buildVehicleGrid() {
  const grid = document.getElementById('vehicle-grid');
  grid.innerHTML = '';
  VEHICLES.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'vehicle-card' + (i === 0 ? ' selected' : '');
    card.innerHTML = `<div class="emoji">${v.emoji}</div><div class="name">${v.name}</div>`;
    card.onclick = () => {
      grid.querySelectorAll('.vehicle-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedVehicle = v;
    };
    grid.appendChild(card);
  });
}

// ========== SPAWN FUNCTIONS ==========
function spawnObstacle() {
  const zone = ZONES[zoneIndex % ZONES.length];
  const gap = Math.max(170 - difficulty * 2, 100);
  const gapY = 80 + Math.random() * (H - 200);

  if (zone.obstacles === 'buildings') {
    // 上下のビル
    obstacles.push({
      x: W + 50, y: 0, w: 60 + Math.random() * 30, h: gapY - gap / 2,
      type: 'building', color: ['#E74C3C', '#3498DB', '#F39C12', '#9B59B6'][Math.floor(Math.random() * 4)],
    });
    obstacles.push({
      x: W + 50, y: gapY + gap / 2, w: 60 + Math.random() * 30, h: H,
      type: 'building', color: ['#E74C3C', '#3498DB', '#F39C12', '#9B59B6'][Math.floor(Math.random() * 4)],
    });
  } else if (zone.obstacles === 'asteroids') {
    const count = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
      const r = 20 + Math.random() * 35;
      let ay;
      do { ay = 50 + Math.random() * (H - 100); }
      while (Math.abs(ay - gapY) < gap / 2 + r);
      obstacles.push({ x: W + 50 + i * 40, y: ay, w: r * 2, h: r * 2, type: 'asteroid', r });
    }
  } else {
    // clouds / rainbow — パイプ型
    obstacles.push({ x: W + 50, y: 0, w: 55, h: gapY - gap / 2, type: 'pipe-top' });
    obstacles.push({ x: W + 50, y: gapY + gap / 2, w: 55, h: H, type: 'pipe-bot' });
  }

  // ギャップ中央にコインライン
  const coinCount = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < coinCount; i++) {
    coins.push({
      x: W + 50 + i * 25,
      y: gapY + (Math.random() - 0.5) * gap * 0.5,
      r: 12, collected: false,
    });
  }
}

function spawnAnimal() {
  const animalEmojis = ['🐻', '🐰', '🐸', '🐱', '🐶', '🐼', '🦊', '🐨', '🐧', '🐵'];
  animals.push({
    x: W + 50,
    y: 80 + Math.random() * (H - 160),
    emoji: animalEmojis[Math.floor(Math.random() * animalEmojis.length)],
    collected: false,
    bobPhase: Math.random() * Math.PI * 2,
  });
}

function spawnPowerup() {
  const types = ['shield', 'magnet', 'slow'];
  powerups.push({
    x: W + 50,
    y: 60 + Math.random() * (H - 120),
    type: types[Math.floor(Math.random() * types.length)],
    r: 18,
  });
}

// ========== PARTICLES ==========
function emit(x, y, emoji, count, spread = 5) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, emoji,
      vx: (Math.random() - 0.5) * spread,
      vy: (Math.random() - 0.5) * spread,
      life: 1, decay: 0.015 + Math.random() * 0.01,
      size: 14 + Math.random() * 16,
      rot: Math.random() * Math.PI * 2,
    });
  }
}

// ========== INIT GAME ==========
function initGame() {
  score = 0; combo = 0; maxCombo = 0; coinStreak = 0;
  frameCount = 0; difficulty = 0; zoneIndex = 0; zoneProgress = 0;
  shakeAmount = 0; flashAlpha = 0;
  player.y = H / 2; player.vy = 0; player.alive = true;
  player.invincible = 0; player.shield = false;
  player.size = 40 * selectedVehicle.size;
  obstacles = []; coins = []; powerups = [];
  particles = []; rescuedAnimals = []; animals = []; trails = [];

  // 背景の星
  bgStars = [];
  for (let i = 0; i < 60; i++) {
    bgStars.push({
      x: Math.random() * W, y: Math.random() * H,
      size: 1 + Math.random() * 2, speed: 0.5 + Math.random() * 1.5,
      twinkle: Math.random() * Math.PI * 2,
    });
  }
}

// ========== GAME SPEED ==========
function gameSpeed() {
  return (3 + difficulty * 0.3 + score * 0.002) * selectedVehicle.speed;
}

// ========== UPDATE ==========
function update() {
  if (state !== 'playing') return;
  frameCount++;

  // Difficulty ramp
  difficulty = Math.floor(score / 50);
  zoneProgress += 0.01;
  if (zoneProgress > 1) { zoneProgress = 0; zoneIndex++; SFX.milestone(); }

  // Voice input
  const rawVoice = micReady ? readMic() : (touching ? 0.2 : 0);
  voiceLevel = rawVoice;
  smoothVoice += (voiceLevel - smoothVoice) * 0.3;

  // Update voice bar
  document.getElementById('voice-bar-fill').style.height = (smoothVoice / 0.4 * 100) + '%';

  // Player physics
  if (player.alive) {
    const lift = smoothVoice > 0.04 ? -smoothVoice * 25 : 2.5; // 声→上昇、無音→下降
    player.vy += lift * 0.15;
    player.vy *= 0.88; // 空気抵抗
    player.vy = Math.max(-8, Math.min(player.vy, 8));
    player.y += player.vy;

    // 天井・床
    if (player.y < player.size / 2) { player.y = player.size / 2; player.vy = 1; }
    if (player.y > H - player.size / 2) { player.y = H - player.size / 2; player.vy = -1; }

    // Trail
    if (frameCount % 2 === 0) {
      trails.push({
        x: player.x - player.size * 0.4,
        y: player.y + (Math.random() - 0.5) * 10,
        life: 1,
        size: 5 + smoothVoice * 30,
      });
    }

    if (player.invincible > 0) player.invincible--;
  }

  const spd = gameSpeed();

  // Spawn
  if (frameCount % Math.max(90 - difficulty * 3, 45) === 0) spawnObstacle();
  if (frameCount % 200 === 100) spawnAnimal();
  if (frameCount % 300 === 150 && Math.random() < 0.5) spawnPowerup();

  // Move obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= spd;
    if (obstacles[i].x + (obstacles[i].w || 50) < -50) obstacles.splice(i, 1);
  }

  // Move coins
  for (let i = coins.length - 1; i >= 0; i--) {
    coins[i].x -= spd;
    if (coins[i].x < -20) { coins.splice(i, 1); continue; }
    if (coins[i].collected) continue;

    // Magnet effect
    if (player.shield) { // reuse shield as magnet too for simplicity
      const dx = player.x - coins[i].x, dy = player.y - coins[i].y;
      if (Math.sqrt(dx * dx + dy * dy) < 120) {
        coins[i].x += dx * 0.1;
        coins[i].y += dy * 0.1;
      }
    }

    // Collect
    const dx = player.x - coins[i].x, dy = player.y - coins[i].y;
    if (dx * dx + dy * dy < (player.size / 2 + coins[i].r) ** 2) {
      coins[i].collected = true;
      coinStreak++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const bonus = Math.min(combo, 10);
      score += 10 + bonus;
      SFX.coin();
      if (combo > 1) SFX.combo(combo);
      emit(coins[i].x, coins[i].y, '✨', 4);
      if (combo % 10 === 0) {
        emit(player.x, player.y, '🔥', 8, 8);
        SFX.powerup();
      }
    }
  }

  // Move animals
  for (let i = animals.length - 1; i >= 0; i--) {
    const a = animals[i];
    a.x -= spd * 0.8;
    a.bobPhase += 0.05;
    if (a.x < -50) { animals.splice(i, 1); continue; }
    if (a.collected) continue;
    const dx = player.x - a.x, dy = player.y - (a.y + Math.sin(a.bobPhase) * 10);
    if (dx * dx + dy * dy < (player.size / 2 + 25) ** 2) {
      a.collected = true;
      rescuedAnimals.push(a.emoji);
      score += 50;
      SFX.animalRescue();
      emit(a.x, a.y, a.emoji, 5, 6);
      emit(a.x, a.y, '💕', 4, 4);
    }
  }

  // Move powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    powerups[i].x -= spd;
    if (powerups[i].x < -30) { powerups.splice(i, 1); continue; }
    const dx = player.x - powerups[i].x, dy = player.y - powerups[i].y;
    if (dx * dx + dy * dy < (player.size / 2 + powerups[i].r) ** 2) {
      const p = powerups[i];
      if (p.type === 'shield') { player.shield = true; player.invincible = 300; }
      else if (p.type === 'slow') { /* slow down handled by difficulty reduction briefly */ }
      score += 30;
      SFX.powerup();
      emit(p.x, p.y, p.type === 'shield' ? '🛡️' : '⚡', 6, 6);
      powerups.splice(i, 1);
    }
  }

  // Collision with obstacles
  if (player.alive && player.invincible <= 0) {
    for (const ob of obstacles) {
      let hit = false;
      if (ob.type === 'asteroid') {
        const dx = player.x - (ob.x + ob.r), dy = player.y - (ob.y);
        hit = Math.sqrt(dx * dx + dy * dy) < player.size / 2 + ob.r - 5;
      } else {
        // Rectangle collision
        const px = player.x, py = player.y, pr = player.size / 2 - 5;
        hit = px + pr > ob.x && px - pr < ob.x + ob.w &&
              py + pr > ob.y && py - pr < ob.y + ob.h;
      }
      if (hit) {
        if (player.shield) {
          player.shield = false;
          player.invincible = 60;
          emit(player.x, player.y, '💥', 6);
          SFX.hit();
          shakeAmount = 8;
        } else {
          player.alive = false;
          SFX.hit();
          emit(player.x, player.y, '💥', 15, 8);
          emit(player.x, player.y, '😵', 3, 4);
          shakeAmount = 15;
          flashAlpha = 0.5;
          setTimeout(gameOver, 800);
        }
        break;
      }
    }
  }

  // Passed obstacle = score
  for (const ob of obstacles) {
    if (!ob.scored && ob.x + (ob.w || 0) < player.x) {
      ob.scored = true;
      if (ob.type === 'pipe-top' || ob.type === 'building') {
        score += 5;
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.08;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Trails
  for (let i = trails.length - 1; i >= 0; i--) {
    trails[i].x -= spd * 0.5;
    trails[i].life -= 0.03;
    if (trails[i].life <= 0) trails.splice(i, 1);
  }

  // Shake decay
  if (shakeAmount > 0) shakeAmount *= 0.85;
  if (flashAlpha > 0) flashAlpha *= 0.9;

  // HUD
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-combo').textContent = combo >= 3 ? `🔥x${combo}` : '';
  document.getElementById('hud-best').textContent = `🏆 ${bestScore}`;
}

// ========== DRAW ==========
function draw() {
  ctx.save();

  // Screen shake
  if (shakeAmount > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * shakeAmount,
      (Math.random() - 0.5) * shakeAmount
    );
  }

  const zone = ZONES[zoneIndex % ZONES.length];
  const nextZone = ZONES[(zoneIndex + 1) % ZONES.length];

  // Background gradient (blend between zones)
  const t = zoneProgress;
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, lerpColor(zone.bgTop, nextZone.bgTop, t));
  bgGrad.addColorStop(1, lerpColor(zone.bgBot, nextZone.bgBot, t));
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Stars (visible in space zone)
  const starAlpha = zone.obstacles === 'asteroids' ? 1 : 0.15;
  for (const s of bgStars) {
    s.x -= s.speed;
    if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    s.twinkle += 0.03;
    ctx.globalAlpha = (0.5 + Math.sin(s.twinkle) * 0.5) * starAlpha;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Ground
  const groundH = 40;
  ctx.fillStyle = lerpColor(zone.groundColor, nextZone.groundColor, t);
  ctx.fillRect(0, H - groundH, W, groundH);
  // Ground detail
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0, H - groundH, W, 3);

  // Trails
  for (const tr of trails) {
    ctx.globalAlpha = tr.life * 0.4;
    ctx.fillStyle = smoothVoice > 0.15 ? '#FFD700' : '#87CEEB';
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, tr.size * tr.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Obstacles
  for (const ob of obstacles) {
    if (ob.type === 'building') {
      ctx.fillStyle = ob.color;
      ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      // Windows
      ctx.fillStyle = 'rgba(255,255,200,0.7)';
      for (let wy = ob.y + 10; wy < ob.y + ob.h - 15; wy += 20) {
        for (let wx = ob.x + 8; wx < ob.x + ob.w - 12; wx += 16) {
          ctx.fillRect(wx, wy, 8, 10);
        }
      }
    } else if (ob.type === 'asteroid') {
      ctx.fillStyle = '#78909C';
      ctx.beginPath();
      ctx.arc(ob.x + ob.r, ob.y, ob.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#546E7A';
      ctx.beginPath();
      ctx.arc(ob.x + ob.r - 5, ob.y - 5, ob.r * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ob.x + ob.r + 8, ob.y + 6, ob.r * 0.2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Pipe style
      const isTop = ob.type === 'pipe-top';
      const pipeColor = zone.obstacles === 'rainbow' ? `hsl(${(ob.x * 0.5) % 360}, 70%, 60%)` : '#4CAF50';
      ctx.fillStyle = pipeColor;
      ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      // Lip
      ctx.fillStyle = zone.obstacles === 'rainbow' ? `hsl(${(ob.x * 0.5 + 30) % 360}, 70%, 50%)` : '#388E3C';
      if (isTop) {
        ctx.fillRect(ob.x - 5, ob.h - 20, ob.w + 10, 20);
      } else {
        ctx.fillRect(ob.x - 5, ob.y, ob.w + 10, 20);
      }
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(ob.x + 5, ob.y, 8, ob.h);
    }
  }

  // Coins
  for (const c of coins) {
    if (c.collected) continue;
    const pulse = Math.sin(frameCount * 0.1 + c.x * 0.1) * 2;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFA000';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r * 0.6, 0, Math.PI * 2);
    ctx.fill();
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(c.x - 3, c.y - 3, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Animals
  for (const a of animals) {
    if (a.collected) continue;
    const bob = Math.sin(a.bobPhase) * 10;
    // Help bubble
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const bx = a.x, by = a.y + bob - 30;
    ctx.beginPath();
    ctx.arc(bx, by, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#E74C3C';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('!', bx, by + 5);
    // Animal
    ctx.font = '35px serif';
    ctx.fillText(a.emoji, a.x, a.y + bob + 12);
  }

  // Powerups
  for (const p of powerups) {
    const glow = Math.sin(frameCount * 0.1) * 0.3 + 0.7;
    ctx.globalAlpha = glow;
    ctx.fillStyle = p.type === 'shield' ? 'rgba(33,150,243,0.3)' : 'rgba(255,152,0,0.3)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.type === 'shield' ? '🛡️' : '⚡', p.x, p.y + 10);
  }

  // Player
  if (player.alive || shakeAmount > 1) {
    ctx.save();
    ctx.translate(player.x, player.y);

    // Shield glow
    if (player.shield) {
      ctx.fillStyle = `rgba(33,150,243,${0.15 + Math.sin(frameCount * 0.1) * 0.1})`;
      ctx.beginPath();
      ctx.arc(0, 0, player.size * 0.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(33,150,243,0.6)`;
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Invincibility blink
    if (player.invincible > 0 && frameCount % 6 < 3) {
      ctx.globalAlpha = 0.4;
    }

    // Vehicle tilt based on velocity
    ctx.rotate(player.vy * 0.05);

    // Vehicle emoji
    ctx.font = `${player.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(selectedVehicle.emoji, 0, 0);

    // Propulsion effect when voice active
    if (smoothVoice > 0.05) {
      const intensity = Math.min(smoothVoice / 0.3, 1);
      for (let i = 0; i < 3; i++) {
        const fx = -player.size * 0.5 - 5 - i * 8 - Math.random() * 5;
        const fy = (Math.random() - 0.5) * 15;
        const fr = 4 + intensity * 8 - i * 2;
        ctx.fillStyle = `rgba(255, ${150 + i * 40}, 0, ${0.6 - i * 0.15})`;
        ctx.beginPath();
        ctx.arc(fx, fy, Math.max(fr, 2), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore();
  }

  // Rescued animals following
  rescuedAnimals.forEach((emoji, i) => {
    const followX = player.x - 30 - i * 25;
    const followY = player.y + Math.sin(frameCount * 0.05 + i) * 8;
    ctx.font = '22px serif';
    ctx.textAlign = 'center';
    ctx.fillText(emoji, followX, followY + 8);
  });

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.font = `${p.size}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // Combo text
  if (combo >= 5) {
    ctx.save();
    ctx.translate(player.x, player.y - player.size - 15);
    const scale = 1 + Math.sin(frameCount * 0.2) * 0.1;
    ctx.scale(scale, scale);
    ctx.font = `bold ${Math.min(14 + combo, 28)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = combo >= 20 ? '#FF0000' : combo >= 10 ? '#FF6B00' : '#FFD700';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    const txt = combo >= 20 ? `🔥 ${combo}コンボ！！` : `${combo}コンボ！`;
    ctx.strokeText(txt, 0, 0);
    ctx.fillText(txt, 0, 0);
    ctx.restore();
  }

  // Zone name (fade in/out)
  if (zoneProgress < 0.1) {
    const alpha = zoneProgress / 0.1;
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${clamp(24, 6, 36)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'white';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    const zName = ZONES[zoneIndex % ZONES.length].name + 'ゾーン！';
    ctx.strokeText(zName, W / 2, H / 2);
    ctx.fillText(zName, W / 2, H / 2);
    ctx.globalAlpha = 1;
  }

  // Flash overlay (on hit)
  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,0,0,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

function lerpColor(a, b, t) {
  const parse = c => {
    const n = parseInt(c.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const [ar, ag, ab] = parse(a), [br, bg, bb] = parse(b);
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return `rgb(${r},${g},${bl})`;
}

// ========== GAME OVER ==========
function gameOver() {
  state = 'gameover';
  combo = 0;

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('osora_best', bestScore);
  }

  document.getElementById('go-score').textContent = score;
  document.getElementById('go-best').textContent =
    score >= bestScore ? `🎉 ベストスコア こうしん！` : `🏆 ベスト: ${bestScore}`;
  document.getElementById('go-title').textContent =
    score >= 500 ? 'すごい！！' : score >= 200 ? 'がんばったね！' : 'ゲームオーバー';
  document.getElementById('go-animals').textContent =
    rescuedAnimals.length > 0
      ? `たすけた どうぶつ: ${rescuedAnimals.join(' ')}`
      : '';

  document.getElementById('gameover-screen').classList.remove('hidden');
}

// ========== MAIN LOOP ==========
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ========== EVENTS ==========
document.getElementById('btn-start').onclick = async () => {
  SFX.init();
  await setupMic();
  buildVehicleGrid();
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('select-screen').classList.remove('hidden');
};

document.getElementById('btn-go').onclick = () => {
  SFX.resume();
  SFX.powerup();
  document.getElementById('select-screen').classList.add('hidden');
  initGame();
  state = 'playing';
};

document.getElementById('btn-retry').onclick = () => {
  SFX.resume();
  document.getElementById('gameover-screen').classList.add('hidden');
  initGame();
  state = 'playing';
};

document.getElementById('btn-title').onclick = () => {
  document.getElementById('gameover-screen').classList.add('hidden');
  document.getElementById('title-screen').classList.remove('hidden');
  state = 'title';
};

// Touch fallback
canvas.addEventListener('touchstart', e => { e.preventDefault(); touching = true; SFX.resume(); });
canvas.addEventListener('touchend', e => { e.preventDefault(); touching = false; });
canvas.addEventListener('touchcancel', () => touching = false);
canvas.addEventListener('mousedown', () => touching = true);
canvas.addEventListener('mouseup', () => touching = false);

// Start render loop (even on title)
loop();
</script>

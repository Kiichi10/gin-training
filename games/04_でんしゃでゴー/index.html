<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>でんしゃで ゴー！🚃</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;touch-action:none;font-family:'Hiragino Maru Gothic ProN',sans-serif;background:#000;height:100vh;width:100vw}
canvas{display:block}

.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:12px;transition:opacity .4s}
.overlay.hidden{opacity:0;pointer-events:none}

#title-screen{background:linear-gradient(135deg,#1565C0,#1976D2,#42A5F5)}
#result-screen{background:rgba(0,0,0,.75)}
#train-select{background:linear-gradient(135deg,#1a1a2e,#16213e)}

.title{font-size:clamp(2rem,9vw,4.5rem);font-weight:900;color:#FFD700;text-shadow:3px 3px 0 #0D47A1,0 0 20px rgba(255,215,0,.4)}
.big-emoji{font-size:clamp(4rem,14vw,7rem)}

.desc{color:rgba(255,255,255,.9);font-size:clamp(.9rem,3vw,1.3rem);text-align:center;line-height:1.8}

.btn{font-size:clamp(1.2rem,4vw,1.8rem);padding:13px 40px;border:none;border-radius:50px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.btn:active{transform:scale(.93)}
.btn-go{background:linear-gradient(135deg,#FFD700,#FFA000);color:#333;box-shadow:0 5px 0 #E65100}
.btn-blue{background:linear-gradient(135deg,#42A5F5,#1E88E5);color:#fff;box-shadow:0 5px 0 #1565C0}

/* 電車選択 */
.train-grid{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:92vw}
.train-card{width:clamp(85px,21vw,120px);height:clamp(95px,24vw,130px);background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.train-card:active,.train-card.selected{border-color:#FFD700;background:rgba(255,215,0,.12);transform:scale(1.05)}
.train-card .emoji{font-size:clamp(2.2rem,7vw,3.5rem)}
.train-card .name{color:#fff;font-size:clamp(.65rem,1.8vw,.85rem);font-weight:bold}
.train-card.locked{opacity:.4}
.train-card.locked .name{color:#999}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:6px 12px;z-index:10;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}
.hud-col{display:flex;flex-direction:column;gap:2px}
.hud-item{color:#fff;font-weight:bold;font-size:clamp(.85rem,2.5vw,1.2rem);text-shadow:0 2px 4px rgba(0,0,0,.6)}
.hud-big{font-size:clamp(1.2rem,3.5vw,1.8rem)}

/* 速度メーター */
#speedo{position:fixed;right:12px;bottom:100px;width:clamp(80px,18vw,120px);height:clamp(80px,18vw,120px);z-index:10;pointer-events:none}

/* コントロール */
#controls{position:fixed;bottom:0;left:0;right:0;height:90px;z-index:10;display:flex;align-items:center;justify-content:center;gap:0}
.ctrl-zone{flex:1;height:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(1rem,3.5vw,1.5rem);font-weight:bold;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;transition:background .15s}
#zone-brake{background:linear-gradient(0deg,rgba(244,67,54,.8),rgba(244,67,54,.4));border-radius:20px 0 0 0}
#zone-brake:active,#zone-brake.active{background:rgba(244,67,54,.95)}
#zone-accel{background:linear-gradient(0deg,rgba(76,175,80,.8),rgba(76,175,80,.4));border-radius:0 20px 0 0}
#zone-accel:active,#zone-accel.active{background:rgba(76,175,80,.95)}

/* 駅名表示 */
#station-announce{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
#station-announce .st-name{font-size:clamp(2rem,7vw,3.5rem);color:#FFD700;font-weight:900;text-shadow:0 3px 8px rgba(0,0,0,.7)}
#station-announce .st-sub{font-size:clamp(1rem,3vw,1.5rem);color:#fff}

/* 判定表示 */
#judge-display{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);z-index:16;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
.judge-text{font-size:clamp(2.5rem,9vw,5rem);font-weight:900;text-shadow:0 4px 10px rgba(0,0,0,.6)}

/* リザルト */
.result-rank{font-size:clamp(4rem,15vw,8rem)}
.result-score{font-size:clamp(2rem,8vw,4rem);color:#FFD700;font-weight:900;text-shadow:0 0 20px rgba(255,215,0,.4)}
.result-detail{color:rgba(255,255,255,.8);font-size:clamp(.9rem,2.5vw,1.2rem);text-align:center;line-height:1.8}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-col">
    <div class="hud-item hud-big" id="hud-speed">0 km/h</div>
    <div class="hud-item" id="hud-next">つぎ: ---</div>
  </div>
  <div class="hud-col" style="align-items:flex-end">
    <div class="hud-item" id="hud-score">0 てん</div>
    <div class="hud-item" id="hud-station">1 / 5</div>
  </div>
</div>

<div id="station-announce">
  <div class="st-sub" id="sa-sub"></div>
  <div class="st-name" id="sa-name"></div>
</div>

<div id="judge-display">
  <div class="judge-text" id="judge-text"></div>
</div>

<div id="controls">
  <div class="ctrl-zone" id="zone-brake">🛑 ブレーキ</div>
  <div class="ctrl-zone" id="zone-accel">💨 スピード</div>
</div>

<!-- タイトル -->
<div class="overlay" id="title-screen">
  <div class="big-emoji">🚃</div>
  <div class="title">でんしゃで ゴー！</div>
  <div class="desc">
    スピードを あげて はしろう！<br>
    えきに ぴったり とまれるかな？
  </div>
  <button class="btn btn-go" id="btn-start">あそぶ！</button>
</div>

<!-- 電車選択 -->
<div class="overlay hidden" id="train-select">
  <div style="color:#FFD700;font-size:clamp(1.3rem,4.5vw,2rem);font-weight:bold">でんしゃを えらぼう！</div>
  <div class="train-grid" id="train-grid"></div>
  <button class="btn btn-go" id="btn-depart">しゅっぱつ！</button>
</div>

<!-- リザルト -->
<div class="overlay hidden" id="result-screen">
  <div style="color:#fff;font-size:clamp(1.5rem,5vw,2.5rem);font-weight:bold">うんてん けっか</div>
  <div class="result-rank" id="res-rank"></div>
  <div class="result-score" id="res-score"></div>
  <div class="result-detail" id="res-detail"></div>
  <button class="btn btn-go" id="btn-retry">もういっかい！</button>
  <button class="btn btn-blue" id="btn-back">タイトルへ</button>
</div>

<script>
// ======== AUDIO ========
const SFX={
  ctx:null,
  init(){this.ctx=new(window.AudioContext||window.webkitAudioContext)()},
  resume(){if(this.ctx?.state==='suspended')this.ctx.resume()},
  tone(f,t,d,v=.1,del=0){
    if(!this.ctx)return;const c=this.ctx.currentTime+del;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,c);g.gain.exponentialRampToValueAtTime(.001,c+d);
    o.connect(g).connect(this.ctx.destination);o.start(c);o.stop(c+d);
  },
  bell(){this.tone(1200,'sine',.08,.08);this.tone(1500,'sine',.08,.08,.1)},
  brake(){
    if(!this.ctx)return;const c=this.ctx.currentTime;
    const n=this.ctx.createBufferSource();
    const b=this.ctx.createBuffer(1,this.ctx.sampleRate*.15,this.ctx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.03*(1-i/d.length);
    n.buffer=b;const g=this.ctx.createGain();g.gain.value=.6;
    n.connect(g).connect(this.ctx.destination);n.start(c);
  },
  whistle(){this.tone(880,'sine',.15,.1);this.tone(660,'sine',.25,.1,.15)},
  horn(){this.tone(440,'sine',.3,.12);this.tone(554,'sine',.3,.12,.05)},
  chug(spd){this.tone(60+spd*2,'square',.04,.02)},
  excellent(){[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,'sine',.25,.1,i*.1))},
  good(){[523,659,784].forEach((f,i)=>this.tone(f,'sine',.2,.08,i*.12))},
  ok(){this.tone(440,'triangle',.2,.08);this.tone(523,'triangle',.2,.08,.1)},
  miss(){this.tone(200,'sawtooth',.2,.1);this.tone(150,'sawtooth',.3,.1,.15)},
  clear(){[523,659,784,1047].forEach((f,i)=>this.tone(f,'sine',.35,.12,i*.18))},
  accel(){this.tone(200+Math.random()*100,'triangle',.05,.02)},
  door(){this.tone(800,'sine',.1,.06);this.tone(600,'sine',.1,.06,.15)},
};

// ======== TRAINS ========
const TRAINS=[
  {id:'local',emoji:'🚃',name:'ふつう',color:'#4CAF50',maxSpeed:80,accel:1,brake:1.2},
  {id:'rapid',emoji:'🚇',name:'かいそく',color:'#2196F3',maxSpeed:110,accel:1.3,brake:1},
  {id:'express',emoji:'🚄',name:'とっきゅう',color:'#FF9800',maxSpeed:140,accel:1.5,brake:.8},
  {id:'shinkansen',emoji:'🚅',name:'しんかんせん',color:'#E53935',maxSpeed:200,accel:2,brake:.7},
];

// ======== ROUTES ========
function generateRoute(routeNum){
  const stationNames=[
    ['ひまわり','たんぽぽ','さくら','にじいろ','ほしぞら'],
    ['うみかぜ','かもめ','やしの木','さんご','いるか'],
    ['ゆきやま','もみの木','こぐま','おんせん','きつね'],
    ['そらまめ','つくし','てんとう','ひばり','おひさま'],
  ];
  const names=stationNames[routeNum%stationNames.length];
  const sceneryType=['countryside','coastal','mountain','spring'][routeNum%4];

  const stations=[];
  const totalDist=3000+routeNum*500;
  for(let i=0;i<names.length;i++){
    const dist=i===0?0:Math.floor(totalDist/(names.length-1)*i);
    stations.push({
      name:names[i],
      dist,
      stopLine:dist, // 停止位置
      arrived:false,
      judged:false,
      judgement:'',
    });
  }
  return{stations,totalDist,sceneryType,routeNum};
}

// ======== STATE ========
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
addEventListener('resize',resize);resize();

let state='title';
let selectedTrain=TRAINS[0];
let route=null;
let routeNum=0;

// Physics
let trainDist=0;
let trainSpeed=0; // km/h
let accelInput=false;
let brakeInput=false;
let currentStationIdx=0;
let score=0;
let totalJudgements=[];
let particles=[];
let frameCount=0;

// Scenery
let sceneryObjs=[];
let trackOffset=0;

// UI timers
let announceTimer=0;
let judgeTimer=0;
let doorTimer=0;
let departReady=false;

// ======== SCENERY GENERATION ========
function initScenery(){
  sceneryObjs=[];
  const type=route.sceneryType;
  for(let i=0;i<60;i++){
    const x=Math.random()*route.totalDist*1.2;
    if(type==='countryside'){
      sceneryObjs.push({dist:x,type:['tree','tree','flower','house','cow'][Math.floor(Math.random()*5)],
        y:.45+Math.random()*.1,size:.7+Math.random()*.6});
    }else if(type==='coastal'){
      sceneryObjs.push({dist:x,type:['palm','wave','boat','seagull','shell'][Math.floor(Math.random()*5)],
        y:.45+Math.random()*.1,size:.7+Math.random()*.6});
    }else if(type==='mountain'){
      sceneryObjs.push({dist:x,type:['pine','rock','snow','deer','cabin'][Math.floor(Math.random()*5)],
        y:.45+Math.random()*.1,size:.7+Math.random()*.6});
    }else{
      sceneryObjs.push({dist:x,type:['sakura','butterfly','tulip','bird','bench'][Math.floor(Math.random()*5)],
        y:.45+Math.random()*.1,size:.7+Math.random()*.6});
    }
  }
}

// ======== INIT GAME ========
function initGame(){
  route=generateRoute(routeNum);
  trainDist=0;trainSpeed=0;
  accelInput=false;brakeInput=false;
  currentStationIdx=0;score=0;
  totalJudgements=[];particles=[];frameCount=0;
  announceTimer=0;judgeTimer=0;doorTimer=0;departReady=false;
  initScenery();
  // Start at first station
  trainDist=route.stations[0].dist;
  route.stations[0].arrived=true;
  route.stations[0].judged=true;
  currentStationIdx=1;
  announceStation(route.stations[0].name,'はっしゃ！');
  updateHUD();
}

// ======== HUD ========
function updateHUD(){
  document.getElementById('hud-speed').textContent=`${Math.floor(trainSpeed)} km/h`;
  const next=route.stations[currentStationIdx];
  if(next){
    const dist=Math.max(0,next.dist-trainDist);
    document.getElementById('hud-next').textContent=`つぎ: ${next.name}えき（${Math.floor(dist)}m）`;
  }else{
    document.getElementById('hud-next').textContent='しゅうてん！';
  }
  document.getElementById('hud-score').textContent=`${score} てん`;
  document.getElementById('hud-station').textContent=`${Math.min(currentStationIdx,route.stations.length)} / ${route.stations.length}`;
}

// ======== ANNOUNCEMENTS ========
function announceStation(name,sub){
  document.getElementById('sa-name').textContent=name+'えき';
  document.getElementById('sa-sub').textContent=sub;
  const el=document.getElementById('station-announce');
  el.style.opacity=1;
  announceTimer=120;
}

function showJudge(text,color){
  const el=document.getElementById('judge-text');
  el.textContent=text;
  el.style.color=color;
  document.getElementById('judge-display').style.opacity=1;
  judgeTimer=90;
}

// ======== UPDATE ========
function update(){
  frameCount++;

  // Timers
  if(announceTimer>0){announceTimer--;if(announceTimer===0)document.getElementById('station-announce').style.opacity=0;}
  if(judgeTimer>0){judgeTimer--;if(judgeTimer===0)document.getElementById('judge-display').style.opacity=0;}

  // Door timer (waiting at station)
  if(doorTimer>0){
    doorTimer--;
    if(doorTimer===60)SFX.door(); // door close sound
    if(doorTimer===0){
      departReady=false;
      SFX.whistle();
      announceStation(route.stations[currentStationIdx]?.name||'','つぎは '+( route.stations[currentStationIdx]?.name||'しゅうてん')+'えき');
    }
    updateHUD();
    updateParticles();
    return;
  }

  if(state!=='playing')return;

  // Physics
  const t=selectedTrain;
  if(accelInput&&trainSpeed<t.maxSpeed){
    trainSpeed+=t.accel*.4;
    if(frameCount%8===0)SFX.accel();
  }
  if(brakeInput&&trainSpeed>0){
    trainSpeed-=t.brake*1.2;
    if(trainSpeed>10&&frameCount%12===0)SFX.brake();
  }
  if(!accelInput&&!brakeInput){
    // Natural deceleration
    trainSpeed-=.08;
  }
  trainSpeed=Math.max(0,Math.min(trainSpeed,t.maxSpeed));

  // Movement
  trainDist+=trainSpeed*.05;

  // Chug sound
  if(trainSpeed>5&&frameCount%Math.max(4,Math.floor(30-trainSpeed*.15))===0){
    SFX.chug(trainSpeed);
  }

  // Station approach
  const st=route.stations[currentStationIdx];
  if(st&&!st.arrived){
    const dist=st.dist-trainDist;

    // Approaching announcement
    if(dist<500&&dist>490){
      SFX.bell();
      announceStation(st.name,'まもなく');
    }

    // Arrived at station zone
    if(dist<30&&dist>-30&&trainSpeed<3&&!st.judged){
      st.arrived=true;
      st.judged=true;

      // Judge accuracy
      const error=Math.abs(dist);
      let judge,pts,color;
      if(error<5){
        judge='🎯 かんぺき！';pts=1000;color='#FFD700';
        SFX.excellent();
        emit(W/2,H*.4,'🎯',8,8);emit(W/2,H*.4,'✨',12,10);
      }else if(error<12){
        judge='⭐ すごい！';pts=500;color='#FF9800';
        SFX.good();
        emit(W/2,H*.4,'⭐',6,6);
      }else if(error<25){
        judge='👍 いいね！';pts=200;color='#4CAF50';
        SFX.ok();
        emit(W/2,H*.4,'👍',4,5);
      }else{
        judge='😅 おしい！';pts=50;color='#9E9E9E';
        SFX.ok();
      }

      st.judgement=judge;
      score+=pts;
      totalJudgements.push({name:st.name,judge,pts,error});
      showJudge(judge,color);

      // Door open sequence
      doorTimer=120;
      SFX.door();
      currentStationIdx++;

      // Check if last station
      if(currentStationIdx>=route.stations.length){
        setTimeout(showResult,2500);
      }
    }

    // Overshot station
    if(dist<-50&&!st.judged){
      st.judged=true;
      st.judgement='💨 とおりすぎ！';
      totalJudgements.push({name:st.name,judge:'💨 とおりすぎ！',pts:0,error:999});
      showJudge('💨 とおりすぎ！','#F44336');
      SFX.miss();
      emit(W/2,H*.4,'💨',6,6);
      currentStationIdx++;
      if(currentStationIdx>=route.stations.length){
        setTimeout(showResult,1500);
      }
    }
  }

  updateParticles();
  updateHUD();
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.08;
    p.life-=p.decay;
    if(p.life<=0)particles.splice(i,1);
  }
}

function emit(x,y,emoji,count,spread=5){
  for(let i=0;i<count;i++){
    particles.push({x,y,emoji,
      vx:(Math.random()-.5)*spread,vy:(Math.random()-.5)*spread-2,
      life:1,decay:.012+Math.random()*.01,size:16+Math.random()*14});
  }
}

// ======== DRAW ========
function draw(){
  ctx.clearRect(0,0,W,H);

  if(state==='title'||!route){drawTitleBg();return;}

  const type=route.sceneryType;

  // Sky
  const g=ctx.createLinearGradient(0,0,0,H*.5);
  if(type==='countryside'){g.addColorStop(0,'#87CEEB');g.addColorStop(1,'#B3E5FC');}
  else if(type==='coastal'){g.addColorStop(0,'#29B6F6');g.addColorStop(1,'#81D4FA');}
  else if(type==='mountain'){g.addColorStop(0,'#78909C');g.addColorStop(1,'#B0BEC5');}
  else{g.addColorStop(0,'#F8BBD0');g.addColorStop(1,'#FCE4EC');}
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H*.5);

  // Sun/moon
  if(type==='mountain'){
    ctx.fillStyle='#CFD8DC';ctx.beginPath();ctx.arc(W-60,50,25,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#FFD54F';ctx.beginPath();ctx.arc(W-60,50,25,0,Math.PI*2);ctx.fill();
  }

  // Background landscape
  drawLandscape();

  // Ground
  ctx.fillStyle=type==='coastal'?'#FFE0B2':type==='mountain'?'#8D6E63':'#81C784';
  ctx.fillRect(0,H*.55,W,H*.45);

  // Track
  drawTrack();

  // Scenery objects
  drawSceneryObjs();

  // Stations
  drawStations();

  // Train
  drawTrain();

  // Speed lines when fast
  if(trainSpeed>60){
    ctx.strokeStyle=`rgba(255,255,255,${Math.min((trainSpeed-60)/100,.3)})`;
    ctx.lineWidth=2;
    for(let i=0;i<8;i++){
      const lx=Math.random()*W;
      const ly=H*.3+Math.random()*H*.4;
      ctx.beginPath();
      ctx.moveTo(lx,ly);
      ctx.lineTo(lx-40-trainSpeed*.3,ly);
      ctx.stroke();
    }
  }

  // Speedometer
  drawSpeedometer();

  // Particles
  for(const p of particles){
    ctx.globalAlpha=p.life;
    ctx.font=`${p.size}px serif`;
    ctx.textAlign='center';
    ctx.fillText(p.emoji,p.x,p.y);
  }
  ctx.globalAlpha=1;

  // Next station distance bar
  drawDistanceBar();
}

function drawTitleBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1565C0');g.addColorStop(1,'#0D47A1');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function drawLandscape(){
  const type=route.sceneryType;
  // Mountains/hills in background
  ctx.fillStyle=type==='coastal'?'rgba(41,182,246,.2)':
    type==='mountain'?'rgba(120,144,156,.3)':
    type==='spring'?'rgba(248,187,208,.3)':'rgba(129,199,132,.3)';
  for(let i=0;i<5;i++){
    const mx=(i*W/4-trainDist*.02)%W;
    const mh=60+Math.sin(i*1.7)*30;
    ctx.beginPath();
    ctx.arc(mx,H*.55,mh+40,Math.PI,0);
    ctx.fill();
  }
}

function drawTrack(){
  const trackY=H*.68;
  // Gravel
  ctx.fillStyle='#9E9E9E';
  ctx.fillRect(0,trackY-6,W,16);
  // Rails
  ctx.fillStyle='#616161';
  ctx.fillRect(0,trackY-4,W,3);
  ctx.fillRect(0,trackY+5,W,3);
  // Ties
  ctx.fillStyle='#5D4037';
  const tieOff=(trainDist*3)%20;
  for(let x=-tieOff;x<W+20;x+=20){
    ctx.fillRect(x,trackY-6,4,16);
  }
}

function drawSceneryObjs(){
  const viewLeft=trainDist-100;
  const viewRight=trainDist+W/.8;
  const emojis={
    tree:'🌳',flower:'🌻',house:'🏠',cow:'🐄',
    palm:'🌴',wave:'🌊',boat:'⛵',seagull:'🐦',shell:'🐚',
    pine:'🌲',rock:'🪨',snow:'❄️',deer:'🦌',cabin:'🏔️',
    sakura:'🌸',butterfly:'🦋',tulip:'🌷',bird:'🐤',bench:'🪑',
  };
  for(const obj of sceneryObjs){
    if(obj.dist<viewLeft||obj.dist>viewRight)continue;
    const sx=(obj.dist-trainDist)*(W/800)+W*.15;
    const sy=H*obj.y;
    ctx.font=`${28*obj.size}px serif`;
    ctx.textAlign='center';
    ctx.fillText(emojis[obj.type]||'🌳',sx,sy);
  }
}

function drawStations(){
  for(const st of route.stations){
    const sx=(st.dist-trainDist)*(W/800)+W*.15;
    if(sx<-100||sx>W+100)continue;

    // Platform
    ctx.fillStyle='#BDBDBD';
    ctx.fillRect(sx-40,H*.62,80,H*.068);

    // Building
    ctx.fillStyle='#FFCC80';
    ctx.fillRect(sx-25,H*.47,50,H*.15);
    // Roof
    ctx.fillStyle='#E65100';
    ctx.beginPath();
    ctx.moveTo(sx-30,H*.47);ctx.lineTo(sx,H*.42);ctx.lineTo(sx+30,H*.47);
    ctx.fill();

    // Station name
    ctx.fillStyle='white';
    ctx.fillRect(sx-22,H*.5,44,16);
    ctx.fillStyle='#333';
    ctx.font='bold 10px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(st.name,sx,H*.5+12);

    // Stop line
    ctx.strokeStyle='#F44336';
    ctx.lineWidth=3;
    ctx.setLineDash([5,3]);
    ctx.beginPath();
    ctx.moveTo(sx,H*.62);ctx.lineTo(sx,H*.73);
    ctx.stroke();
    ctx.setLineDash([]);

    // 停止目標マーク
    ctx.fillStyle='#F44336';
    ctx.font='bold 10px sans-serif';
    ctx.fillText('▼ とまれ',sx,H*.75);

    // Judgement display
    if(st.judged&&st.judgement){
      ctx.font='bold 12px sans-serif';
      ctx.fillStyle='#FFD700';
      ctx.fillText(st.judgement,sx,H*.4);
    }
  }
}

function drawTrain(){
  const tx=W*.15;
  const trackY=H*.68;
  const shake=trainSpeed>0?Math.sin(Date.now()/60)*Math.min(trainSpeed*.015,1.5):0;

  ctx.save();
  ctx.translate(tx,trackY-16+shake);

  // Smoke
  if(trainSpeed>10){
    for(let i=0;i<3;i++){
      const sx2=-30-i*10-Math.random()*8;
      const sy2=-18-i*8-Math.random()*4;
      const sr=4+i*3;
      ctx.fillStyle=`rgba(200,200,200,${.5-i*.12})`;
      ctx.beginPath();ctx.arc(sx2,sy2,sr,0,Math.PI*2);ctx.fill();
    }
  }

  // Train emoji (large)
  ctx.font='45px serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(selectedTrain.emoji,0,0);

  ctx.restore();
}

function drawSpeedometer(){
  const cx=W-clamp(55,45,70);
  const cy=H-145;
  const r=clamp(38,32,48);

  ctx.save();
  ctx.translate(cx,cy);

  // Background
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(40,40,40,.9)';
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();

  // Speed arc
  const maxAngle=Math.PI*1.5;
  const startA=Math.PI*.75;
  const speedRatio=trainSpeed/selectedTrain.maxSpeed;
  const endA=startA+maxAngle*speedRatio;

  ctx.strokeStyle=speedRatio>.8?'#F44336':speedRatio>.5?'#FFD700':'#4CAF50';
  ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,0,r-6,startA,endA);ctx.stroke();

  // Ticks
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
  for(let i=0;i<=10;i++){
    const a=startA+maxAngle*(i/10);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*(r-12),Math.sin(a)*(r-12));
    ctx.lineTo(Math.cos(a)*(r-4),Math.sin(a)*(r-4));
    ctx.stroke();
  }

  // Needle
  const needleA=startA+maxAngle*speedRatio;
  ctx.strokeStyle='#F44336';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.lineTo(Math.cos(needleA)*(r-10),Math.sin(needleA)*(r-10));
  ctx.stroke();

  // Center
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();

  // Speed text
  ctx.fillStyle='#fff';ctx.font=`bold ${r*.35}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(Math.floor(trainSpeed),0,r*.35);

  ctx.restore();
}

function drawDistanceBar(){
  if(currentStationIdx>=route.stations.length)return;
  const st=route.stations[currentStationIdx];
  if(!st)return;
  const prevDist=route.stations[currentStationIdx-1]?.dist||0;
  const totalSeg=st.dist-prevDist;
  const progress=Math.min(1,(trainDist-prevDist)/totalSeg);

  const barW=W*.6;
  const barH=6;
  const barX=(W-barW)/2;
  const barY=H-96;

  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle='#FFD700';
  ctx.fillRect(barX,barY,barW*progress,barH);

  // Train icon on bar
  ctx.font='12px serif';ctx.textAlign='center';
  ctx.fillText('🚃',barX+barW*progress,barY-6);
  ctx.fillText('🚏',barX+barW,barY-6);
}

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}

// ======== RESULT ========
function showResult(){
  state='result';
  SFX.clear();

  // Calculate rank
  const maxScore=route.stations.length*1000;
  const ratio=score/maxScore;
  let rank,rankEmoji;
  if(ratio>=.9){rank='S';rankEmoji='👑';}
  else if(ratio>=.7){rank='A';rankEmoji='🎉';}
  else if(ratio>=.5){rank='B';rankEmoji='😊';}
  else if(ratio>=.3){rank='C';rankEmoji='👍';}
  else{rank='D';rankEmoji='💪';}

  document.getElementById('res-rank').textContent=rankEmoji+rank;
  document.getElementById('res-score').textContent=score+' てん';

  let detail=totalJudgements.map(j=>`${j.name}えき: ${j.judge}`).join('\n');
  document.getElementById('res-detail').textContent=detail;

  document.getElementById('result-screen').classList.remove('hidden');

  emit(W/2,H*.3,'🎉',10,10);
  emit(W/2,H*.3,'✨',8,8);
}

// ======== TRAIN SELECT ========
function buildTrainGrid(){
  const grid=document.getElementById('train-grid');
  grid.innerHTML='';
  TRAINS.forEach((t,i)=>{
    const card=document.createElement('div');
    card.className='train-card'+(i===0?' selected':'');
    card.innerHTML=`<div class="emoji">${t.emoji}</div><div class="name">${t.name}</div><div class="name" style="color:#aaa">${t.maxSpeed}km/h</div>`;
    card.onclick=()=>{
      grid.querySelectorAll('.train-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      selectedTrain=t;
    };
    grid.appendChild(card);
  });
}

// ======== EVENTS ========
document.getElementById('btn-start').onclick=()=>{
  SFX.init();
  buildTrainGrid();
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('train-select').classList.remove('hidden');
};

document.getElementById('btn-depart').onclick=()=>{
  SFX.resume();SFX.horn();
  document.getElementById('train-select').classList.add('hidden');
  state='playing';
  initGame();
};

document.getElementById('btn-retry').onclick=()=>{
  SFX.resume();
  document.getElementById('result-screen').classList.add('hidden');
  routeNum++;
  state='playing';
  initGame();
};

document.getElementById('btn-back').onclick=()=>{
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('title-screen').classList.remove('hidden');
  state='title';
};

// Controls
const accelEl=document.getElementById('zone-accel');
const brakeEl=document.getElementById('zone-brake');

function startAccel(e){e.preventDefault();SFX.resume();accelInput=true;accelEl.classList.add('active');}
function stopAccel(e){e.preventDefault();accelInput=false;accelEl.classList.remove('active');}
function startBrake(e){e.preventDefault();SFX.resume();brakeInput=true;brakeEl.classList.add('active');}
function stopBrake(e){e.preventDefault();brakeInput=false;brakeEl.classList.remove('active');}

accelEl.addEventListener('touchstart',startAccel);
accelEl.addEventListener('touchend',stopAccel);
accelEl.addEventListener('touchcancel',stopAccel);
accelEl.addEventListener('mousedown',startAccel);
accelEl.addEventListener('mouseup',stopAccel);
accelEl.addEventListener('mouseleave',stopAccel);

brakeEl.addEventListener('touchstart',startBrake);
brakeEl.addEventListener('touchend',stopBrake);
brakeEl.addEventListener('touchcancel',stopBrake);
brakeEl.addEventListener('mousedown',startBrake);
brakeEl.addEventListener('mouseup',stopBrake);
brakeEl.addEventListener('mouseleave',stopBrake);

// ======== MAIN LOOP ========
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>おえかきレール 🚂✏️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden; touch-action: none;
    font-family: 'Hiragino Maru Gothic ProN', sans-serif;
    background: #1a1a2e; height: 100vh; width: 100vw;
  }
  canvas { display: block; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; gap: 14px;
    transition: opacity 0.4s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  #title-screen {
    background: linear-gradient(135deg, #2E7D32, #43A047, #66BB6A);
  }

  #clear-screen {
    background: rgba(0,0,0,0.7);
  }

  .title {
    font-size: clamp(2.2rem, 9vw, 4.5rem);
    font-weight: 900; color: #FFD700;
    text-shadow: 3px 3px 0 #1B5E20, 0 0 20px rgba(255,215,0,0.4);
  }

  .big-emoji { font-size: clamp(4rem, 14vw, 7rem); }

  .desc {
    color: rgba(255,255,255,0.9);
    font-size: clamp(1rem, 3vw, 1.4rem);
    text-align: center; line-height: 1.8;
  }

  .btn {
    font-size: clamp(1.3rem, 4.5vw, 2rem);
    padding: 14px 45px; border: none; border-radius: 50px;
    font-weight: bold; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.93); }
  .btn-go {
    background: linear-gradient(135deg, #FFD700, #FFA000);
    color: #333; box-shadow: 0 5px 0 #E65100;
  }
  .btn-next {
    background: linear-gradient(135deg, #42A5F5, #1E88E5);
    color: white; box-shadow: 0 5px 0 #1565C0;
  }

  /* HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 8px 15px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10; pointer-events: none;
  }
  .hud-item {
    color: white; font-weight: bold;
    font-size: clamp(1rem, 3vw, 1.4rem);
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none;
  }

  /* 下部ボタン */
  #bottom-bar {
    position: fixed; bottom: 12px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px;
    z-index: 10;
  }
  .bar-btn {
    font-size: clamp(1rem, 3vw, 1.3rem);
    padding: 10px 22px; border: none; border-radius: 30px;
    font-weight: bold; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .bar-btn:active { transform: scale(0.93); }
  .btn-draw {
    background: rgba(255,255,255,0.9); color: #333;
    box-shadow: 0 3px 0 #aaa;
  }
  .btn-run {
    background: linear-gradient(135deg, #FF5722, #E64A19); color: white;
    box-shadow: 0 3px 0 #BF360C;
  }
  .btn-erase {
    background: rgba(255,255,255,0.2); color: white;
    box-shadow: 0 3px 0 rgba(0,0,0,0.3);
  }

  /* フェーズ表示 */
  #phase-label {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    color: white; font-weight: bold;
    text-shadow: 0 3px 6px rgba(0,0,0,0.5);
    z-index: 15; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }

  /* クリア画面 */
  .clear-stars { font-size: clamp(3rem, 10vw, 5rem); }
  .clear-score {
    font-size: clamp(2rem, 7vw, 3.5rem);
    color: #FFD700; font-weight: 900;
    text-shadow: 0 0 20px rgba(255,215,0,0.4);
  }
  .clear-detail {
    color: rgba(255,255,255,0.8);
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-item" id="hud-level">レベル 1</div>
  <div class="hud-item" id="hud-stars">☆☆☆</div>
  <div class="hud-item" id="hud-score">⭐ 0</div>
</div>

<div id="phase-label"></div>

<div id="bottom-bar">
  <button class="bar-btn btn-erase" id="btn-erase">🗑 けす</button>
  <button class="bar-btn btn-run" id="btn-run">🚂 はしらせる！</button>
</div>

<!-- タイトル -->
<div class="overlay" id="title-screen">
  <div class="big-emoji">🚂✏️</div>
  <div class="title">おえかきレール</div>
  <div class="desc">
    ゆびで せんろを かこう！<br>
    でんしゃが はしって ⭐を あつめるよ！
  </div>
  <button class="btn btn-go" id="btn-start">あそぶ！</button>
</div>

<!-- クリア -->
<div class="overlay hidden" id="clear-screen">
  <div style="color:white; font-size:clamp(1.8rem,6vw,3rem); font-weight:bold;" id="clear-title">🎉 クリア！</div>
  <div class="clear-stars" id="clear-stars-display"></div>
  <div class="clear-score" id="clear-score-display"></div>
  <div class="clear-detail" id="clear-detail"></div>
  <button class="btn btn-next" id="btn-next">つぎの レベル！</button>
  <button class="btn btn-go" id="btn-retry-clear">もういちど</button>
</div>

<script>
// ============ AUDIO ============
const SFX = {
  ctx: null,
  init() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  resume() { if (this.ctx?.state === 'suspended') this.ctx.resume(); },
  tone(freq, type, dur, vol = 0.1, delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  },
  star() { this.tone(988, 'sine', 0.1, 0.12); this.tone(1319, 'sine', 0.15, 0.12, 0.06); },
  chug(pitch) { this.tone(80 + pitch * 20, 'square', 0.06, 0.04); },
  whistle() { this.tone(800, 'sine', 0.2, 0.1); this.tone(600, 'sine', 0.3, 0.1, 0.2); },
  clear() { [523,659,784,1047].forEach((f,i) => this.tone(f, 'sine', 0.3, 0.12, i*0.15)); },
  draw() { this.tone(300 + Math.random() * 200, 'triangle', 0.05, 0.02); },
  erase() { this.tone(200, 'sawtooth', 0.15, 0.06); },
  fail() { this.tone(200, 'sawtooth', 0.2, 0.1); this.tone(150, 'sawtooth', 0.3, 0.1, 0.15); },
  bonus() { [660,880,1100,1320].forEach((f,i) => this.tone(f, 'triangle', 0.2, 0.08, i*0.08)); },
};

// ============ CONSTANTS ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

// ============ LEVELS ============
function generateLevel(n) {
  const stars = [];
  const obstacles = [];
  const startX = 60, startY = H / 2;
  const goalX = W - 80;
  let goalY = H * 0.3 + Math.random() * H * 0.4;

  // Stars: progressively harder placement
  const count = Math.min(3 + Math.floor(n / 2), 8);
  for (let i = 0; i < count; i++) {
    let sx, sy, valid;
    let attempts = 0;
    do {
      sx = 120 + Math.random() * (W - 250);
      sy = 80 + Math.random() * (H - 200);
      valid = true;
      // Don't overlap other stars
      for (const s of stars) {
        if (Math.hypot(s.x - sx, s.y - sy) < 60) { valid = false; break; }
      }
      // Don't be too close to start
      if (Math.hypot(startX - sx, startY - sy) < 100) valid = false;
      attempts++;
    } while (!valid && attempts < 50);
    stars.push({ x: sx, y: sy, r: 22, collected: false });
  }

  // Obstacles from level 3+
  if (n >= 3) {
    const obsCount = Math.min(Math.floor((n - 2) * 1.5), 8);
    for (let i = 0; i < obsCount; i++) {
      let ox, oy, valid;
      let attempts = 0;
      do {
        ox = 100 + Math.random() * (W - 200);
        oy = 60 + Math.random() * (H - 160);
        valid = true;
        for (const s of stars) {
          if (Math.hypot(s.x - ox, s.y - oy) < 80) { valid = false; break; }
        }
        for (const o of obstacles) {
          if (Math.hypot(o.x - ox, o.y - oy) < 70) { valid = false; break; }
        }
        if (Math.hypot(startX - ox, startY - oy) < 100) valid = false;
        if (Math.hypot(goalX - ox, goalY - oy) < 100) valid = false;
        attempts++;
      } while (!valid && attempts < 50);
      const types = ['rock', 'tree', 'house'];
      obstacles.push({
        x: ox, y: oy,
        r: 25 + Math.random() * 15,
        type: types[Math.floor(Math.random() * types.length)],
      });
    }
  }

  // Animals to rescue (bonus, from level 2+)
  const animalList = ['🐻', '🐰', '🐸', '🐱', '🐶', '🐼', '🦊', '🐨', '🐧'];
  const rescueAnimals = [];
  if (n >= 2) {
    const animalCount = Math.min(1 + Math.floor(n / 3), 3);
    for (let i = 0; i < animalCount; i++) {
      let ax, ay, valid;
      let attempts = 0;
      do {
        ax = 130 + Math.random() * (W - 280);
        ay = 80 + Math.random() * (H - 200);
        valid = true;
        for (const s of stars) { if (Math.hypot(s.x - ax, s.y - ay) < 60) valid = false; }
        for (const o of obstacles) { if (Math.hypot(o.x - ax, o.y - ay) < 60) valid = false; }
        for (const a of rescueAnimals) { if (Math.hypot(a.x - ax, a.y - ay) < 60) valid = false; }
        attempts++;
      } while (!valid && attempts < 50);
      rescueAnimals.push({
        x: ax, y: ay,
        emoji: animalList[Math.floor(Math.random() * animalList.length)],
        collected: false,
      });
    }
  }

  return {
    level: n,
    start: { x: startX, y: startY },
    goal: { x: goalX, y: goalY, r: 30 },
    stars,
    obstacles,
    animals: rescueAnimals,
    totalStars: count,
  };
}

// ============ GAME STATE ============
let state = 'title'; // title, drawing, running, clear
let level = 1;
let totalScore = 0;
let currentLevel = null;
let rail = []; // [{x, y}, ...]
let drawing = false;
let trainPos = 0; // 0 to rail.length-1
let trainSpeed = 0;
let trainDir = 1;
let collectedStars = 0;
let collectedAnimals = [];
let hitObstacle = false;
let reachedGoal = false;
let particles = [];
let drawSoundTimer = 0;

// Smoothed rail for rendering
let smoothRail = [];

// ============ RAIL SMOOTHING ============
function smoothPath(points) {
  if (points.length < 3) return points;
  const result = [points[0]];
  for (let i = 1; i < points.length - 1; i++) {
    const p0 = points[i - 1], p1 = points[i], p2 = points[i + 1];
    result.push({
      x: p0.x * 0.2 + p1.x * 0.6 + p2.x * 0.2,
      y: p0.y * 0.2 + p1.y * 0.6 + p2.y * 0.2,
    });
  }
  result.push(points[points.length - 1]);
  return result;
}

function resamplePath(points, spacing = 6) {
  if (points.length < 2) return points;
  const result = [points[0]];
  let carry = 0;
  for (let i = 1; i < points.length; i++) {
    const dx = points[i].x - points[i-1].x;
    const dy = points[i].y - points[i-1].y;
    const d = Math.hypot(dx, dy);
    if (d < 1) continue;
    const nx = dx / d, ny = dy / d;
    let pos = carry;
    while (pos < d) {
      result.push({
        x: points[i-1].x + nx * pos,
        y: points[i-1].y + ny * pos,
      });
      pos += spacing;
    }
    carry = pos - d;
  }
  return result;
}

function processRail() {
  if (rail.length < 2) { smoothRail = rail; return; }
  // Multiple smoothing passes
  let path = rail;
  for (let pass = 0; pass < 3; pass++) {
    path = smoothPath(path);
  }
  smoothRail = resamplePath(path, 5);
}

// ============ DRAWING ============
function getPos(e) {
  const touch = e.touches ? e.touches[0] : e;
  return { x: touch.clientX, y: touch.clientY };
}

function onDrawStart(e) {
  if (state !== 'drawing') return;
  e.preventDefault();
  SFX.resume();
  drawing = true;
  const p = getPos(e);
  // If empty, start from train station
  if (rail.length === 0) {
    rail.push({ x: currentLevel.start.x, y: currentLevel.start.y });
  }
  // Connect to last point
  rail.push(p);
  processRail();
}

function onDrawMove(e) {
  if (!drawing || state !== 'drawing') return;
  e.preventDefault();
  const p = getPos(e);
  const last = rail[rail.length - 1];
  if (last && Math.hypot(p.x - last.x, p.y - last.y) > 8) {
    rail.push(p);
    processRail();
    drawSoundTimer++;
    if (drawSoundTimer % 5 === 0) SFX.draw();
  }
}

function onDrawEnd(e) {
  if (!drawing) return;
  e.preventDefault();
  drawing = false;
}

canvas.addEventListener('touchstart', onDrawStart);
canvas.addEventListener('touchmove', onDrawMove);
canvas.addEventListener('touchend', onDrawEnd);
canvas.addEventListener('mousedown', onDrawStart);
canvas.addEventListener('mousemove', onDrawMove);
canvas.addEventListener('mouseup', onDrawEnd);

// ============ PARTICLES ============
function emit(x, y, emoji, count, spread = 5) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, emoji,
      vx: (Math.random() - 0.5) * spread,
      vy: (Math.random() - 0.5) * spread - 1,
      life: 1, decay: 0.012 + Math.random() * 0.008,
      size: 14 + Math.random() * 16,
    });
  }
}

// ============ START LEVEL ============
function startLevel(n) {
  level = n;
  currentLevel = generateLevel(n);
  rail = [];
  smoothRail = [];
  trainPos = 0;
  trainSpeed = 0;
  collectedStars = 0;
  collectedAnimals = [];
  hitObstacle = false;
  reachedGoal = false;
  particles = [];
  state = 'drawing';

  document.getElementById('hud-level').textContent = `レベル ${n}`;
  updateHudStars();
  document.getElementById('btn-run').textContent = '🚂 はしらせる！';
  document.getElementById('btn-run').style.display = '';
  document.getElementById('btn-erase').style.display = '';

  showPhase('✏️ せんろを かこう！');
}

function showPhase(text) {
  const el = document.getElementById('phase-label');
  el.textContent = text;
  el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 1500);
}

function updateHudStars() {
  let s = '';
  for (let i = 0; i < currentLevel.totalStars; i++) {
    s += i < collectedStars ? '⭐' : '☆';
  }
  document.getElementById('hud-stars').textContent = s;
}

// ============ RUN TRAIN ============
function runTrain() {
  if (smoothRail.length < 10) {
    showPhase('もっと ながく かいてね！');
    return;
  }
  state = 'running';
  trainPos = 0;
  trainSpeed = 0;
  hitObstacle = false;
  reachedGoal = false;
  SFX.whistle();
  showPhase('🚂 しゅっぱーつ！');

  document.getElementById('btn-run').style.display = 'none';
  document.getElementById('btn-erase').style.display = 'none';
}

// ============ UPDATE ============
let chugTimer = 0;

function update() {
  // Particle physics
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (state !== 'running') return;

  // Train movement
  const targetSpeed = Math.max(2, 3 + level * 0.3);
  trainSpeed += (targetSpeed - trainSpeed) * 0.03;
  trainPos += trainSpeed;

  // Chugga sound
  chugTimer++;
  if (chugTimer % Math.max(8, 20 - Math.floor(trainSpeed * 2)) === 0) {
    SFX.chug(trainSpeed);
  }

  if (trainPos >= smoothRail.length - 1) {
    trainPos = smoothRail.length - 1;
    // Check if near goal
    const tp = smoothRail[Math.floor(trainPos)];
    if (tp && Math.hypot(tp.x - currentLevel.goal.x, tp.y - currentLevel.goal.y) < currentLevel.goal.r + 30) {
      if (!reachedGoal) {
        reachedGoal = true;
        setTimeout(showClear, 500);
      }
    } else if (!reachedGoal && !hitObstacle) {
      // Didn't reach goal
      showPhase('🚩 ゴールまで とどかなかった！');
      SFX.fail();
      setTimeout(() => {
        state = 'drawing';
        document.getElementById('btn-run').style.display = '';
        document.getElementById('btn-erase').style.display = '';
        showPhase('✏️ もういちど かこう！');
      }, 1200);
    }
    return;
  }

  const tp = smoothRail[Math.floor(trainPos)];
  if (!tp) return;

  // Star collection
  for (const star of currentLevel.stars) {
    if (star.collected) continue;
    if (Math.hypot(tp.x - star.x, tp.y - star.y) < star.r + 18) {
      star.collected = true;
      collectedStars++;
      updateHudStars();
      SFX.star();
      emit(star.x, star.y, '✨', 8, 6);
      emit(star.x, star.y, '⭐', 3, 4);
      totalScore += 100;
      document.getElementById('hud-score').textContent = `⭐ ${totalScore}`;
    }
  }

  // Animal rescue
  for (const a of currentLevel.animals) {
    if (a.collected) continue;
    if (Math.hypot(tp.x - a.x, tp.y - a.y) < 35) {
      a.collected = true;
      collectedAnimals.push(a.emoji);
      SFX.bonus();
      emit(a.x, a.y, a.emoji, 5, 6);
      emit(a.x, a.y, '💕', 4);
      totalScore += 200;
      document.getElementById('hud-score').textContent = `⭐ ${totalScore}`;
    }
  }

  // Obstacle collision
  if (!hitObstacle) {
    for (const ob of currentLevel.obstacles) {
      if (Math.hypot(tp.x - ob.x, tp.y - ob.y) < ob.r + 12) {
        hitObstacle = true;
        trainSpeed = 0;
        SFX.fail();
        emit(tp.x, tp.y, '💥', 10, 8);
        emit(tp.x, tp.y, '😵', 3);
        showPhase('💥 ぶつかった！');
        setTimeout(() => {
          state = 'drawing';
          document.getElementById('btn-run').style.display = '';
          document.getElementById('btn-erase').style.display = '';
          showPhase('✏️ かきなおそう！');
        }, 1500);
        break;
      }
    }
  }
}

// ============ DRAW ============
function drawBg() {
  // Sky
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  const hour = (level - 1) % 4; // 0=day, 1=sunset, 2=night, 3=dawn
  if (hour === 0) { grad.addColorStop(0, '#87CEEB'); grad.addColorStop(1, '#E8F5E9'); }
  else if (hour === 1) { grad.addColorStop(0, '#FF8A65'); grad.addColorStop(1, '#FFE0B2'); }
  else if (hour === 2) { grad.addColorStop(0, '#1a1a2e'); grad.addColorStop(1, '#2d3436'); }
  else { grad.addColorStop(0, '#CE93D8'); grad.addColorStop(1, '#F8BBD0'); }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars at night
  if (hour === 2) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137.5 + level * 50) % W;
      const sy = (i * 97.3) % (H * 0.5);
      const twinkle = Math.sin(Date.now() / 500 + i) * 0.5 + 0.5;
      ctx.globalAlpha = twinkle * 0.8;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Ground
  ctx.fillStyle = hour === 2 ? '#2E7D32' : '#4CAF50';
  ctx.fillRect(0, H - 50, W, 50);
  ctx.fillStyle = hour === 2 ? '#1B5E20' : '#388E3C';
  ctx.fillRect(0, H - 50, W, 4);

  // Decorative background trees/mountains
  ctx.fillStyle = hour === 2 ? '#1B5E20' : '#66BB6A';
  for (let i = 0; i < 8; i++) {
    const tx = (i * W / 7 + level * 30) % (W + 60) - 30;
    const th = 40 + Math.sin(i * 2.5) * 20;
    ctx.beginPath();
    ctx.arc(tx, H - 50, th, Math.PI, 0);
    ctx.fill();
  }
}

function drawStation(pos, label, emoji) {
  const x = pos.x, y = pos.y;
  // Platform
  ctx.fillStyle = '#8D6E63';
  ctx.fillRect(x - 25, y + 15, 50, 8);
  // Building
  ctx.fillStyle = '#FFCC80';
  ctx.fillRect(x - 18, y - 25, 36, 40);
  // Roof
  ctx.fillStyle = '#E65100';
  ctx.beginPath();
  ctx.moveTo(x - 22, y - 25);
  ctx.lineTo(x, y - 42);
  ctx.lineTo(x + 22, y - 25);
  ctx.fill();
  // Sign
  ctx.fillStyle = 'white';
  ctx.fillRect(x - 14, y - 18, 28, 14);
  ctx.fillStyle = '#333';
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x, y - 9);
  // Emoji
  ctx.font = '20px serif';
  ctx.fillText(emoji, x, y - 46);
}

function drawRail() {
  if (smoothRail.length < 2) return;

  // Rail shadow
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 16;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(smoothRail[0].x + 2, smoothRail[0].y + 3);
  for (let i = 1; i < smoothRail.length; i++) {
    ctx.lineTo(smoothRail[i].x + 2, smoothRail[i].y + 3);
  }
  ctx.stroke();

  // Rail bed (gravel)
  ctx.strokeStyle = '#A1887F';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.moveTo(smoothRail[0].x, smoothRail[0].y);
  for (let i = 1; i < smoothRail.length; i++) {
    ctx.lineTo(smoothRail[i].x, smoothRail[i].y);
  }
  ctx.stroke();

  // Ties
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 3;
  for (let i = 0; i < smoothRail.length - 1; i += 8) {
    const p = smoothRail[i];
    const next = smoothRail[Math.min(i + 3, smoothRail.length - 1)];
    const dx = next.x - p.x, dy = next.y - p.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len * 7, ny = dx / len * 7;
    ctx.beginPath();
    ctx.moveTo(p.x + nx, p.y + ny);
    ctx.lineTo(p.x - nx, p.y - ny);
    ctx.stroke();
  }

  // Rails (two parallel lines)
  ctx.lineWidth = 2.5;
  for (const offset of [-4, 4]) {
    ctx.strokeStyle = '#9E9E9E';
    ctx.beginPath();
    for (let i = 0; i < smoothRail.length - 1; i++) {
      const p = smoothRail[i];
      const next = smoothRail[Math.min(i + 1, smoothRail.length - 1)];
      const dx = next.x - p.x, dy = next.y - p.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len * offset, ny = dx / len * offset;
      if (i === 0) ctx.moveTo(p.x + nx, p.y + ny);
      else ctx.lineTo(p.x + nx, p.y + ny);
    }
    ctx.stroke();
  }
}

function drawGoal() {
  const g = currentLevel.goal;
  const pulse = Math.sin(Date.now() / 400) * 4;

  // Glow
  ctx.fillStyle = `rgba(255,215,0,${0.1 + Math.sin(Date.now() / 500) * 0.05})`;
  ctx.beginPath();
  ctx.arc(g.x, g.y, g.r + 20 + pulse, 0, Math.PI * 2);
  ctx.fill();

  drawStation(g, 'ゴール', '🚩');
}

function drawStars() {
  for (const s of currentLevel.stars) {
    if (s.collected) continue;
    const pulse = Math.sin(Date.now() / 300 + s.x) * 3;
    const glow = Math.sin(Date.now() / 400 + s.y) * 0.2 + 0.8;

    // Glow
    ctx.fillStyle = `rgba(255,215,0,${glow * 0.15})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r + 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = glow;
    ctx.font = `${s.r * 2 + pulse}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⭐', s.x, s.y);
    ctx.globalAlpha = 1;
  }
}

function drawObstacles() {
  for (const ob of currentLevel.obstacles) {
    ctx.font = `${ob.r * 1.6}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (ob.type === 'rock') ctx.fillText('🪨', ob.x, ob.y);
    else if (ob.type === 'tree') ctx.fillText('🌳', ob.x, ob.y);
    else ctx.fillText('🏠', ob.x, ob.y);

    // Danger zone indicator
    if (state === 'drawing') {
      ctx.strokeStyle = 'rgba(255,0,0,0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(ob.x, ob.y, ob.r + 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawAnimals() {
  for (const a of currentLevel.animals) {
    if (a.collected) continue;
    const bob = Math.sin(Date.now() / 400 + a.x) * 5;
    // Help speech bubble
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(a.x, a.y - 32 + bob, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#E74C3C';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('たすけて', a.x, a.y - 32 + bob);

    ctx.font = '35px serif';
    ctx.fillText(a.emoji, a.x, a.y + bob + 5);
  }
}

function drawTrain() {
  if (smoothRail.length < 2) return;
  const idx = Math.floor(Math.min(trainPos, smoothRail.length - 1));
  const p = smoothRail[idx];
  if (!p) return;

  // Direction
  const nextIdx = Math.min(idx + 3, smoothRail.length - 1);
  const next = smoothRail[nextIdx];
  const angle = next ? Math.atan2(next.y - p.y, next.x - p.x) : 0;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(angle);

  // Smoke when moving
  if (state === 'running' && trainSpeed > 1 && !hitObstacle) {
    for (let i = 0; i < 3; i++) {
      const sx = -25 - i * 8 - Math.random() * 5;
      const sy = -12 - i * 6 - Math.random() * 3;
      const sr = 4 + i * 3;
      ctx.fillStyle = `rgba(200,200,200,${0.5 - i * 0.12})`;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Train body
  ctx.fillStyle = '#E53935';
  ctx.beginPath();
  ctx.roundRect(-20, -14, 40, 22, 4);
  ctx.fill();

  // Cabin
  ctx.fillStyle = '#C62828';
  ctx.fillRect(10, -20, 12, 8);

  // Window
  ctx.fillStyle = '#BBDEFB';
  ctx.fillRect(12, -18, 8, 5);

  // Chimney
  ctx.fillStyle = '#333';
  ctx.fillRect(-12, -20, 7, 8);

  // Wheels
  const wheelAngle = trainPos * 0.5;
  ctx.fillStyle = '#333';
  for (const wx of [-10, 6, 16]) {
    ctx.beginPath();
    ctx.arc(wx, 10, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(wx + Math.cos(wheelAngle) * 3, 10 + Math.sin(wheelAngle) * 3);
    ctx.lineTo(wx - Math.cos(wheelAngle) * 3, 10 - Math.sin(wheelAngle) * 3);
    ctx.stroke();
  }

  // Face
  if (hitObstacle) {
    ctx.font = '10px serif';
    ctx.textAlign = 'center';
    ctx.fillText('😵', 20, -6);
  } else if (trainSpeed > 2) {
    ctx.font = '10px serif';
    ctx.textAlign = 'center';
    ctx.fillText('😄', 20, -6);
  }

  ctx.restore();

  // Rescued animals following the train
  collectedAnimals.forEach((emoji, i) => {
    const followIdx = Math.max(0, idx - (i + 1) * 18);
    const fp = smoothRail[followIdx];
    if (!fp) return;
    ctx.font = '22px serif';
    ctx.textAlign = 'center';
    ctx.fillText(emoji, fp.x, fp.y + 3);
  });
}

function drawStartStation() {
  drawStation(currentLevel.start, 'スタート', '🏁');

  // Parked train at start (only in drawing mode, before rail exists)
  if (state === 'drawing' && smoothRail.length < 2) {
    ctx.font = '30px serif';
    ctx.textAlign = 'center';
    ctx.fillText('🚂', currentLevel.start.x, currentLevel.start.y + 2);
  }
}

function drawDrawingGuide() {
  if (state !== 'drawing') return;

  // Pencil cursor hint
  if (rail.length === 0) {
    const bobX = Math.sin(Date.now() / 500) * 10;
    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.fillText('✏️', currentLevel.start.x + 40 + bobX, currentLevel.start.y - 10);

    // Arrow from start
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(currentLevel.start.x + 30, currentLevel.start.y);
    ctx.lineTo(currentLevel.start.x + 80, currentLevel.start.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Dotted line from rail end to goal
  if (smoothRail.length > 5) {
    const last = smoothRail[smoothRail.length - 1];
    ctx.strokeStyle = 'rgba(255,215,0,0.25)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(currentLevel.goal.x, currentLevel.goal.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.font = `${p.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawBg();

  if (currentLevel) {
    drawGoal();
    drawStars();
    drawObstacles();
    drawAnimals();
    drawRail();
    drawDrawingGuide();
    drawStartStation();
    drawTrain();
    drawParticles();
  }
}

// ============ CLEAR ============
function showClear() {
  state = 'clear';
  SFX.clear();

  const starRatio = collectedStars / currentLevel.totalStars;
  let rating;
  if (starRatio >= 1) rating = 3;
  else if (starRatio >= 0.6) rating = 2;
  else rating = 1;

  // Bonus for animals
  const animalBonus = collectedAnimals.length * 200;
  if (animalBonus > 0) {
    totalScore += animalBonus;
    document.getElementById('hud-score').textContent = `⭐ ${totalScore}`;
  }

  document.getElementById('clear-title').textContent =
    rating === 3 ? '🎉 パーフェクト！！' : rating === 2 ? '🎉 すごい！' : '🎉 クリア！';

  let starsText = '';
  for (let i = 0; i < 3; i++) starsText += i < rating ? '⭐' : '☆';
  document.getElementById('clear-stars-display').textContent = starsText;
  document.getElementById('clear-score-display').textContent = `${totalScore} てん`;

  let detail = `⭐ ${collectedStars} / ${currentLevel.totalStars} こ あつめた！`;
  if (collectedAnimals.length > 0) {
    detail += `\nたすけた どうぶつ: ${collectedAnimals.join(' ')}`;
  }
  document.getElementById('clear-detail').textContent = detail;

  document.getElementById('clear-screen').classList.remove('hidden');

  // Celebration particles
  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      emit(
        W * 0.2 + Math.random() * W * 0.6,
        H * 0.3 + Math.random() * H * 0.2,
        ['🎉', '🎊', '✨', '🌟', '💫', '🎶'][i],
        6, 7
      );
    }, i * 200);
  }
}

// ============ MAIN LOOP ============
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ============ EVENTS ============
document.getElementById('btn-start').onclick = () => {
  SFX.init();
  document.getElementById('title-screen').classList.add('hidden');
  startLevel(1);
};

document.getElementById('btn-run').onclick = () => {
  SFX.resume();
  runTrain();
};

document.getElementById('btn-erase').onclick = () => {
  if (state !== 'drawing') return;
  rail = [];
  smoothRail = [];
  // Reset collectibles
  if (currentLevel) {
    currentLevel.stars.forEach(s => s.collected = false);
    currentLevel.animals.forEach(a => a.collected = false);
  }
  collectedStars = 0;
  collectedAnimals = [];
  updateHudStars();
  SFX.erase();
};

document.getElementById('btn-next').onclick = () => {
  SFX.resume();
  document.getElementById('clear-screen').classList.add('hidden');
  startLevel(level + 1);
};

document.getElementById('btn-retry-clear').onclick = () => {
  SFX.resume();
  document.getElementById('clear-screen').classList.add('hidden');
  startLevel(level);
};

// Start
loop();
</script>
